name: Final Forms Validate

on:
  push:
    branches: [final-forms]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate registry
        run: node tools/validate-registry.mjs
      - name: Syntax check Final Forms modules
        run: find src/core src/adapters src/apps -type f -name '*.js' -print0 | xargs -0 -n1 node --check
